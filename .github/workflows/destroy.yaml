name: Teardown Infrastructure

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "destroy" to confirm teardown'
        required: true
        type: string

permissions:
  contents: read

env:
  TF_WORKING_DIR: ./infra       # folder containing your .tf files
  ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
  ARM_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
  ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

jobs:
  plan:
    name: Plan Destroy
    # safety guard: only runs if the user typed "destroy"
    if: inputs.confirm == 'destroy'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.TF_WORKING_DIR }}
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Terraform init
        run: terraform init -input=false

      - name: Terraform plan (destroy)
        run: terraform plan -destroy -input=false -out=tfplan-destroy

      - name: Plan summary
        run: |
          echo '### Terraform destroy plan :warning:' >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          terraform show -no-color tfplan-destroy | tail -c 60000 >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Upload plan
        uses: actions/upload-artifact@v4
        with:
          name: tfplan-destroy
          path: ${{ env.TF_WORKING_DIR }}/tfplan-destroy
          retention-days: 5

  destroy:
    name: Destroy
    needs: plan
    runs-on: ubuntu-latest
    environment:
      name: dev
    defaults:
      run:
        working-directory: ${{ env.TF_WORKING_DIR }}
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Download plan
        uses: actions/download-artifact@v4
        with:
          name: tfplan-destroy
          path: ${{ env.TF_WORKING_DIR }}

      - name: Terraform init
        run: terraform init -input=false

      - name: Terraform destroy
        run: terraform apply -input=false -auto-approve tfplan-destroy

      - name: Summary
        run: echo "### Infrastructure destroyed :wastebasket:" >> $GITHUB_STEP_SUMMARY